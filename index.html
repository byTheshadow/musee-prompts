<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSÉE - 画师与提示词归档</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F4F3EF;
      color: #1C1A17;
    }
    .serif-title {
      font-family: 'Playfair Display', serif;
    }
    .logo-font {
      font-family: 'Cinzel', serif;
    }
    .museum-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(28, 26, 23, 0.08);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .museum-card:hover {
      transform: translateY(-4px);
      border-color: rgba(28, 26, 23, 0.2);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
    }
    /* 记事本/文档风格：更宽松、像一页纸 */
    .document-card {
      background: rgba(255, 255, 255, 0.6);
      border-left: 2px solid #1C1A17;
      border-top: 1px solid rgba(28, 26, 23, 0.08);
      border-right: 1px solid rgba(28, 26, 23, 0.08);
      border-bottom: 1px solid rgba(28, 26, 23, 0.08);
      transition: all 0.3s ease;
    }
    
    .drawer-open { transform: translateX(0); }
    .drawer-closed { transform: translateX(100%); }
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-stone-200">

  <!-- 顶部导航栏 -->
  <header class="border-b border-stone-200/80 sticky top-0 bg-[#F4F3EF]/90 backdrop-blur-md z-40">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="#" onclick="switchCategory('artist-string')" class="logo-font text-2xl tracking-[0.2em] font-semibold">MUSÉE</a>
      
      <!-- 分类导航（增加了记事文档） -->
      <nav id="categoryNav" class="hidden md:flex space-x-8 text-xs tracking-[0.15em] font-medium text-stone-500 uppercase">
        <a href="#" onclick="switchCategory('artist-string')" data-cate="artist-string" class="text-stone-900 border-b border-stone-900 pb-1">画师串</a>
        <a href="#" onclick="switchCategory('single-artist')" data-cate="single-artist" class="hover:text-stone-900 transition pb-1">单独画师</a>
        <a href="#" onclick="switchCategory('template')" data-cate="template" class="hover:text-stone-900 transition pb-1">提示词模板</a>
        <a href="#" onclick="switchCategory('collection')" data-cate="collection" class="hover:text-stone-900 transition pb-1">收藏画师</a>
        <a href="#" onclick="switchCategory('document')" data-cate="document" class="hover:text-stone-900 transition pb-1">📌 记事文档</a>
      </nav>

      <div class="flex items-center space-x-4">
        <button id="lockBtn" onclick="promptPassword()" class="px-3 py-1.5 border border-stone-300 rounded-full text-xs tracking-wider hover:bg-stone-100 transition flex items-center gap-1.5">
          <span id="lockIcon">🔒</span> <span id="lockText">未解锁</span>
        </button>
        <button id="openDrawerBtn" class="w-8 h-8 rounded-full bg-stone-950 text-white flex items-center justify-center hover:bg-stone-850 transition">
          ＋
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-12">
    <div class="mb-16 flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-stone-200 pb-6">
      <div>
        <span class="text-xs uppercase tracking-[0.2em] text-stone-400">ARCHIVE / 归档库</span>
        <h1 id="currentCategoryTitle" class="serif-title text-4xl italic mt-2 font-medium">Artist Strings</h1>
      </div>
      <div class="text-right text-xs text-stone-400 tracking-wider">
        <span id="itemCount">LOADING...</span>
      </div>
    </div>

    <!-- 动态展示容器：通过 JS 动态切换网格布局与文档布局 -->
    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- 内容渲染 -->
    </div>
  </main>

  <!-- 侧边栏抽屉 (Drawer) -->
  <div id="drawerOverlay" class="fixed inset-0 bg-stone-950/20 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
    <div id="drawerPanel" class="fixed right-0 top-0 bottom-0 w-full max-w-lg bg-[#F4F3EF] border-l border-stone-200 shadow-2xl flex flex-col drawer-closed transition-transform duration-300 ease-out">
      
      <div class="p-6 border-b border-stone-200 flex items-center justify-between">
        <h2 id="drawerTitle" class="serif-title text-2xl italic font-medium">Add to Archive</h2>
        <button id="closeDrawerBtn" class="text-stone-400 hover:text-stone-900 text-xl font-light">✕</button>
      </div>

      <div id="drawerTabs" class="flex border-b border-stone-200 px-6">
        <button id="tabSingleBtn" class="py-3 px-4 text-xs tracking-widest border-b-2 border-stone-950 font-medium text-stone-950">SINGLE / 单个添加</button>
        <button id="tabBatchBtn" class="py-3 px-4 text-xs tracking-widest border-b-2 border-transparent font-medium text-stone-400 hover:text-stone-950">BATCH / 批量导入</button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        
        <!-- 表单1：单个添加/编辑 -->
        <form id="formSingle" onsubmit="handleSingleSubmit(event)" class="space-y-4">
          <!-- 隐藏输入框，用来记录当前是不是在编辑某条已有的数据 -->
          <input type="hidden" id="editId" value="">
          
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Title / 名称 *</label>
            <input type="text" id="singleTitle" placeholder="例如: 穆夏复古" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-sm" required>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Category / 分类 *</label>
              <select id="singleCategory" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-sm">
                <option value="artist-string">画师串</option>
                <option value="single-artist">单独画师</option>
                <option value="template">提示词模板</option>
                <option value="collection">收藏画师</option>
                <option value="document">📌 记事文档</option>
              </select>
            </div>
            <div>
              <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Tags / 标签</label>
              <input type="text" id="singleTags" placeholder="#古风,#插画" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Prompt String / 内容 * (加密存储)</label>
            <textarea id="singleContent" placeholder="输入画师串或文档详细内容" rows="6" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-sm" required></textarea>
          </div>
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Remarks / 备注 (明文)</label>
            <textarea id="singleRemarks" placeholder="写下使用心得、适合的权重或关联模型" rows="2" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-sm"></textarea>
          </div>
          
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Image Preview / 预览图</label>
            <!-- 展示已有图 -->
            <div id="existingImageContainer" class="hidden mb-2">
              <span class="text-[10px] text-stone-400 block mb-1">已有预览图:</span>
              <img id="existingImagePreview" src="" class="h-20 object-cover rounded border border-stone-300">
              <button type="button" onclick="removeExistingImage()" class="text-[10px] text-red-500 underline mt-1 block">删除此图</button>
            </div>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-stone-200 file:text-stone-700 hover:file:bg-stone-300">
            <p id="compressStatus" class="text-[10px] text-stone-400 mt-1"></p>
          </div>
          
          <button type="submit" id="singleSubmitBtn" class="w-full py-3 bg-stone-950 hover:bg-stone-850 text-white text-xs tracking-widest uppercase font-medium rounded transition">
            Save to Archive / 保存
          </button>
        </form>

        <!-- 表单2：批量导入 -->
        <form id="formBatch" onsubmit="handleBatchSubmit(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Batch Category / 导入目标分类 *</label>
            <select id="batchCategory" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-sm">
              <option value="artist-string">画师串</option>
              <option value="single-artist">单独画师</option>
              <option value="template">提示词模板</option>
              <option value="collection">收藏画师</option>
              <option value="document">📌 记事文档</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-2">Paste Content / 粘贴数据</label>
            <div class="text-[10px] text-stone-400 mb-2 leading-relaxed bg-stone-200/40 p-3 rounded">
              格式：<strong>名称 | 画师串 | 备注 | 标签</strong> (一行一个，用竖线分隔)
            </div>
            <textarea id="batchInput" placeholder="名称 1 | 画师串 1 | 备注 1 | #标签1&#10;名称 2 | 画师串 2 | 备注 2 | #标签2" rows="10" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded focus:outline-none focus:border-stone-950 text-xs font-mono"></textarea>
          </div>
          
          <button type="submit" class="w-full py-3 bg-stone-950 hover:bg-stone-850 text-white text-xs tracking-widest uppercase font-medium rounded transition">
            Import All / 一键导入
          </button>
        </form>

      </div>
    </div>
  </div>

  <footer class="border-t border-stone-200 py-8 text-center text-[10px] tracking-[0.2em] text-stone-400 uppercase mt-auto">
    © MUSÉE COLLECTION. ALL RIGHTS RESERVED.
  </footer>

  <script>
    // ==========================================
    // ⚠️ 数据库配置区
    // ==========================================
    const SUPABASE_URL = "https://gbblgyxkpzkiislxtrfw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiYmxneXhrcHpraWlzbHh0cmZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MjY1MTMsImV4cCI6MjEwMjUwMjUxM30.W8omQO5rvy167JedlMqrfmaKazUqo97wMOO8CBI4PKY"; // <- 重新粘贴你的 Anon Key

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 全局状态
    // ==========================================
    let currentCategory = 'artist-string'; 
    let allItems = []; 
    let masterPassword = sessionStorage.getItem('musee_password') || ''; 
    let compressedImageBase64 = ""; // 保存新压缩的图片
    let existingImageBase64 = "";   // 编辑时已有的图片数据

    // ==========================================
    // 加解密模块
    // ==========================================
    function encryptData(text, password) {
      if (!password) return text;
      return CryptoJS.AES.encrypt(text, password).toString();
    }

    function decryptData(ciphertext, password) {
      if (!password) return null;
      try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, password);
        const originalText = bytes.toString(CryptoJS.enc.Utf8);
        return originalText || null;
      } catch (e) {
        return null;
      }
    }

    function promptPassword() {
      const pwd = prompt("请输入您的主密码以解密/保存画师串:");
      if (pwd !== null) {
        masterPassword = pwd;
        sessionStorage.setItem('musee_password', pwd);
        updateLockUI();
        renderCards(); 
      }
    }

    function updateLockUI() {
      const lockIcon = document.getElementById('lockIcon');
      const lockText = document.getElementById('lockText');
      if (masterPassword) {
        lockIcon.innerText = "🔓";
        lockText.innerText = "已解锁";
      } else {
        lockIcon.innerText = "🔒";
        lockText.innerText = "未解锁";
      }
    }

    // ==========================================
    // 数据库增删改查
    // ==========================================
    
    async function fetchItems() {
      document.getElementById('itemCount').innerText = "LOADING...";
      const { data, error } = await _supabase
        .from('prompts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error fetching:", error);
        return;
      }

      allItems = data;
      renderCards();
    }

    // 单个保存或更新
    async function handleSingleSubmit(e) {
      e.preventDefault();
      
      if (!masterPassword) {
        alert("请先设置主密码以加密数据！");
        promptPassword();
        return;
      }

      const id = document.getElementById('editId').value;
      const title = document.getElementById('singleTitle').value;
      const category = document.getElementById('singleCategory').value;
      const content = document.getElementById('singleContent').value;
      const remarks = document.getElementById('singleRemarks').value;
      const tags = document.getElementById('singleTags').value;

      const encryptedContent = encryptData(content, masterPassword);
      
      // 决定最终存盘的图片：如果有新压缩的用新的，没有就保留现有的，如果清空了就用 null
      const finalImage = compressedImageBase64 || existingImageBase64 || null;

      const dataRow = {
        title,
        category,
        content: encryptedContent,
        remarks,
        tags,
        image_base64: finalImage,
        is_encrypted: true
      };

      let responseError;
      
      if (id) {
        // 编辑模式：更新数据
        const { error } = await _supabase
          .from('prompts')
          .update(dataRow)
          .eq('id', id);
        responseError = error;
      } else {
        // 新增模式：插入数据
        const { error } = await _supabase
          .from('prompts')
          .insert([dataRow]);
        responseError = error;
      }

      if (responseError) {
        alert("保存失败: " + responseError.message);
      } else {
        alert(id ? "修改成功！" : "成功保存至归档！");
        resetSingleForm();
        closeDrawer();
        fetchItems();
      }
    }

    // 批量导入
    async function handleBatchSubmit(e) {
      e.preventDefault();

      if (!masterPassword) {
        alert("请先设置主密码再批量导入！");
        promptPassword();
        return;
      }

      const category = document.getElementById('batchCategory').value;
      const rawText = document.getElementById('batchInput').value;

      if (!rawText.trim()) return alert("请输入数据！");

      const lines = rawText.split('\n');
      const rowsToInsert = [];

      lines.forEach(line => {
        if (!line.trim()) return;
        const parts = line.split('|');
        const title = parts[0]?.trim() || "";
        const rawContent = parts[1]?.trim() || "";
        const remarks = parts[2]?.trim() || "";
        const tags = parts[3]?.trim() || "";

        if (title && rawContent) {
          const encryptedContent = encryptData(rawContent, masterPassword);
          rowsToInsert.push({
            title,
            category,
            content: encryptedContent,
            remarks,
            tags,
            is_encrypted: true
          });
        }
      });

      if (rowsToInsert.length === 0) return alert("未解析到有效数据。");

      const { error } = await _supabase.from('prompts').insert(rowsToInsert);

      if (error) {
        alert("导入失败: " + error.message);
      } else {
        alert(`成功导入 ${rowsToInsert.length} 条数据！`);
        document.getElementById('batchInput').value = "";
        closeDrawer();
        fetchItems();
      }
    }

    // 删除单条
    async function deleteItem(id, title) {
      if (!confirm(`确认要删除 “${title}” 吗？此操作无法撤销。`)) return;

      const { error } = await _supabase
        .from('prompts')
        .delete()
        .eq('id', id);

      if (error) {
        alert("删除失败: " + error.message);
      } else {
        fetchItems();
      }
    }

    // 编辑按钮点击：填充表单并展开
    function editItem(id) {
      const item = allItems.find(i => i.id === id);
      if (!item) return;

      if (!masterPassword) {
        alert("解密编辑需要输入密码！");
        promptPassword();
        if (!masterPassword) return; // 用户如果取消了就终止
      }

      const decrypted = decryptData(item.content, masterPassword);
      if (!decrypted) {
        alert("无法解密，请确保主密码输入正确！");
        return;
      }

      // 切换 Drawer 状态为“编辑单个”
      document.getElementById('editId').value = item.id;
      document.getElementById('singleTitle').value = item.title;
      document.getElementById('singleCategory').value = item.category;
      document.getElementById('singleContent').value = decrypted;
      document.getElementById('singleRemarks').value = item.remarks || "";
      document.getElementById('singleTags').value = item.tags || "";
      
      // 处理已有图片预览
      if (item.image_base64) {
        existingImageBase64 = item.image_base64;
        document.getElementById('existingImagePreview').src = item.image_base64;
        document.getElementById('existingImageContainer').classList.remove('hidden');
      } else {
        existingImageBase64 = "";
        document.getElementById('existingImageContainer').classList.add('hidden');
      }

      // 调整 UI
      document.getElementById('drawerTitle').innerText = "Edit Archive";
      document.getElementById('singleSubmitBtn').innerText = "Update Archive / 更新";
      document.getElementById('drawerTabs').classList.add('hidden'); // 编辑时隐藏 Tab
      
      // 切换到单个 Tab 表单
      tabSingleBtn.click();
      openDrawer();
    }

    function removeExistingImage() {
      existingImageBase64 = "";
      document.getElementById('existingImageContainer').classList.add('hidden');
    }

    function resetSingleForm() {
      document.getElementById('formSingle').reset();
      document.getElementById('editId').value = "";
      compressedImageBase64 = "";
      existingImageBase64 = "";
      document.getElementById('existingImageContainer').classList.add('hidden');
      document.getElementById('compressStatus').innerText = "";
      document.getElementById('drawerTitle').innerText = "Add to Archive";
      document.getElementById('singleSubmitBtn').innerText = "Save to Archive / 保存";
      document.getElementById('drawerTabs').classList.remove('hidden');
    }

    // ==========================================
    // 复制与 UI 渲染
    // ==========================================
    function copyPrompt(btn, ciphertext) {
      if (!masterPassword) {
        alert("内容已加密，请先输入密码解锁后才能复制！");
        promptPassword();
        return;
      }

      const decrypted = decryptData(ciphertext, masterPassword);
      if (!decrypted) {
        alert("解密失败，主密码错误！");
        return;
      }

      navigator.clipboard.writeText(decrypted).then(() => {
        const originalText = btn.innerText;
        btn.innerText = "COPIED! ✓";
        btn.style.color = "#15803d";
        setTimeout(() => {
          btn.innerText = originalText;
          btn.style.color = "";
        }, 1500);
      });
    }

    function switchCategory(cate) {
      currentCategory = cate;
      
      document.querySelectorAll('#categoryNav a').forEach(a => {
        if (a.getAttribute('data-cate') === cate) {
          a.className = "text-stone-900 border-b border-stone-900 pb-1";
        } else {
          a.className = "hover:text-stone-900 transition pb-1";
        }
      });

      const titles = {
        'artist-string': 'Artist Strings / 画师串',
        'single-artist': 'Individual Artists / 单独画师',
        'template': 'Prompt Templates / 提示词模板',
        'collection': 'Collection / 收藏画师',
        'document': '📌 Documents & Notes / 记事文档'
      };
      document.getElementById('currentCategoryTitle').innerText = titles[cate] || 'Archive';

      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = "";

      const filtered = allItems.filter(item => item.category === currentCategory);
      document.getElementById('itemCount').innerText = `${filtered.length} ITEMS`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-20 text-center text-stone-400 text-xs tracking-widest uppercase">
            No items found.
          </div>
        `;
        return;
      }

      // 如果当前是“记事文档”模式，切换成单列宽松排版
      if (currentCategory === 'document') {
        container.className = "max-w-4xl mx-auto space-y-12 w-full col-span-full"; // 更改容器类为单列居中
        
        filtered.forEach(item => {
          const docElement = document.createElement('div');
          docElement.className = "document-card p-8 md:p-12 rounded-lg shadow-sm flex flex-col justify-between";

          let contentDisplay = "🔒 此文档已被加密 (请在右上角解锁查看)";
          if (masterPassword) {
            const decrypted = decryptData(item.content, masterPassword);
            contentDisplay = decrypted ? decrypted : "❌ 密码错误，无法解密";
          }

          // 将文档中的换行替换成 HTML 的换行，展现宽松的文本段落
          const formattedContent = contentDisplay.replace(/\n/g, '<br>');

          docElement.innerHTML = `
            <div>
              <div class="flex items-center justify-between border-b border-stone-200 pb-4 mb-6">
                <div>
                  <span class="text-[10px] tracking-widest text-stone-400 uppercase">📌 DOCUMENT NOTE</span>
                  <h2 class="serif-title text-2xl font-semibold mt-1">${item.title}</h2>
                </div>
                <div class="flex gap-4 text-xs">
                  <button onclick="editItem('${item.id}')" class="text-stone-400 hover:text-stone-850">编辑</button>
                  <button onclick="deleteItem('${item.id}', '${item.title}')" class="text-red-400 hover:text-red-600">删除</button>
                </div>
              </div>
              
              <!-- 配图展现（文档模式只在顶部放一个优雅的长图） -->
              ${item.image_base64 ? `<img src="${item.image_base64}" class="w-full max-h-[300px] object-cover rounded mb-6 opacity-90">` : ''}

              <!-- 宽松明文备注 -->
              ${item.remarks ? `<p class="text-xs text-stone-400 italic mb-6">备注：${item.remarks}</p>` : ''}

              <!-- 宽松宽敞的文章段落渲染，支持防复制 -->
              <div class="no-select text-stone-700 leading-8 text-base tracking-wide whitespace-pre-wrap font-serif mb-8 p-6 bg-white/40 rounded border border-stone-200/50" oncontextmenu="return false">
                ${formattedContent}
              </div>
            </div>
            
            <div class="flex items-center justify-between text-xs border-t border-stone-100 pt-4">
              <span class="text-[10px] text-stone-400">${new Date(item.created_at).toLocaleDateString()}</span>
              <button onclick="copyPrompt(this, '${item.content}')" class="tracking-wider border-b border-stone-900 pb-0.5 hover:text-stone-500 font-medium">
                COPY DOCUMENT CONTENT
              </button>
            </div>
          `;
          container.appendChild(docElement);
        });

      } else {
        // 其他常规卡片布局 (画师串/模板等)
        container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8";

        filtered.forEach(item => {
          const card = document.createElement('div');
          card.className = "museum-card rounded-lg overflow-hidden flex flex-col justify-between";

          let imageHtml = "";
          if (item.image_base64) {
            imageHtml = `
              <div class="aspect-[4/3] bg-stone-200 relative overflow-hidden group">
                <img src="${item.image_base64}" alt="${item.title}" class="w-full h-full object-cover transition duration-700 group-hover:scale-105">
              </div>
            `;
          } else {
            const firstChar = item.title.charAt(0).toUpperCase();
            imageHtml = `
              <div class="aspect-[4/3] bg-stone-300/30 flex items-center justify-center select-none">
                <span class="logo-font text-8xl font-light text-stone-200">${firstChar}</span>
              </div>
            `;
          }

          let contentDisplay = "🔒 已加密 (点击下方按钮复制解锁)";
          if (masterPassword) {
            const decrypted = decryptData(item.content, masterPassword);
            contentDisplay = decrypted ? decrypted : "❌ 密码错误，无法解密内容";
          }

          let tagsHtml = "";
          if (item.tags) {
            tagsHtml = item.tags.split(',').map(tag => 
              `<span class="text-[10px] bg-stone-200/50 px-2 py-0.5 rounded text-stone-600">${tag.trim()}</span>`
            ).join(' ');
          }

          card.innerHTML = `
            <div>
              ${imageHtml}
              <div class="p-6">
                <!-- 顶部编辑与删除微调 -->
                <div class="flex items-center justify-between text-[10px] uppercase tracking-[0.15em] text-stone-400 mb-2">
                  <span>${item.category.replace('-', ' ')}</span>
                  <div class="flex gap-2">
                    <button onclick="editItem('${item.id}')" class="hover:text-stone-900 transition">编辑</button>
                    <button onclick="deleteItem('${item.id}', '${item.title}')" class="hover:text-red-500 transition">删除</button>
                  </div>
                </div>
                <h2 class="serif-title text-xl italic font-semibold mb-3">${item.title}</h2>
                <p class="text-xs text-stone-500 mb-4">${item.remarks || '无备注'}</p>
                
                <div class="no-select p-3 bg-stone-200/40 rounded text-xs font-mono text-stone-600 break-all mb-4" oncontextmenu="return false">
                  ${contentDisplay}
                </div>
              </div>
            </div>

            <div class="px-6 pb-6">
              <div class="flex flex-wrap gap-1.5 mb-6">
                ${tagsHtml}
              </div>
              <div class="pt-4 border-t border-stone-200/60 flex items-center justify-between">
                <span class="text-[10px] text-stone-400 font-mono">
                  ${new Date(item.created_at).toLocaleDateString()}
                </span>
                <button onclick="copyPrompt(this, '${item.content}')" class="text-xs tracking-wider border-b border-stone-900 pb-0.5 hover:text-stone-500 font-medium">
                  COPY STRING
                </button>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      }
    }

    // ==========================================
    // 侧边栏与 Tab 切换交互
    // ==========================================
    const openDrawerBtn = document.getElementById('openDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerPanel = document.getElementById('drawerPanel');

    function openDrawer() {
      drawerOverlay.classList.remove('pointer-events-none', 'opacity-0');
      drawerOverlay.classList.add('opacity-100');
      drawerPanel.classList.remove('drawer-closed');
      drawerPanel.classList.add('drawer-open');
    }

    function closeDrawer() {
      drawerOverlay.classList.remove('opacity-100');
      drawerOverlay.classList.add('pointer-events-none', 'opacity-0');
      drawerPanel.classList.remove('drawer-open');
      drawerPanel.classList.add('drawer-closed');
      resetSingleForm(); // 关闭时重置表单，避免“编辑”状态遗留
    }

    openDrawerBtn.addEventListener('click', openDrawer);
    closeDrawerBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) closeDrawer();
    });

    const tabSingleBtn = document.getElementById('tabSingleBtn');
    const tabBatchBtn = document.getElementById('tabBatchBtn');
    const formSingle = document.getElementById('formSingle');
    const formBatch = document.getElementById('formBatch');

    tabSingleBtn.addEventListener('click', () => {
      tabSingleBtn.className = "py-3 px-4 text-xs tracking-widest border-b-2 border-stone-950 font-medium text-stone-950";
      tabBatchBtn.className = "py-3 px-4 text-xs tracking-widest border-b-2 border-transparent font-medium text-stone-400 hover:text-stone-950";
      formSingle.classList.remove('hidden');
      formBatch.classList.add('hidden');
    });

    tabBatchBtn.addEventListener('click', () => {
      tabBatchBtn.className = "py-3 px-4 text-xs tracking-widest border-b-2 border-stone-950 font-medium text-stone-950";
      tabSingleBtn.className = "py-3 px-4 text-xs tracking-widest border-b-2 border-transparent font-medium text-stone-400 hover:text-stone-950";
      formBatch.classList.remove('hidden');
      formSingle.classList.add('hidden');
    });

    // ==========================================
    // 图片压缩
    // ==========================================
    const imageInput = document.getElementById('imageInput');
    const compressStatus = document.getElementById('compressStatus');

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      compressStatus.innerText = "正在压缩图片...";
      
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const max_width = 800;
          let width = img.width;
          let height = img.height;

          if (width > max_width) {
            height = Math.round((height * max_width) / width);
            width = max_width;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          compressedImageBase64 = canvas.toDataURL('image/webp', 0.7);
          const sizeInKb = Math.round((compressedImageBase64.length * 3) / 4 / 1024);
          compressStatus.innerText = `压缩成功! 大小约: ${sizeInKb} KB (将覆盖原图)`;
        };
      };
    });

    // ==========================================
    // 初始化
    // ==========================================
    updateLockUI();
    fetchItems();
  </script>
</body>
</html>
