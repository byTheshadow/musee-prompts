<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSÉE - 画师与提示词归档</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- 引入解耦后的 CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="min-h-screen flex flex-col antialiased selection:bg-stone-200">

  <!-- 顶部导航栏 -->
  <header class="border-b border-stone-200/80 sticky top-0 bg-[#F4F3EF]/90 backdrop-blur-md z-40">
    <div class="max-w-7xl mx-auto px-4 md:px-6 h-20 flex items-center justify-between">
      <a href="#" onclick="switchCategory('artist-string')" class="logo-font text-2xl tracking-[0.2em] font-semibold">MUSÉE</a>
      
      <nav id="categoryNav" class="hidden md:flex space-x-8 text-xs tracking-[0.15em] font-medium text-stone-500 uppercase">
        <a href="#" onclick="switchCategory('artist-string')" data-cate="artist-string" class="text-stone-900 border-b border-stone-900 pb-1">画师串</a>
        <a href="#" onclick="switchCategory('single-artist')" data-cate="single-artist" class="hover:text-stone-900 transition pb-1">单独画师</a>
        <a href="#" onclick="switchCategory('template')" data-cate="template" class="hover:text-stone-900 transition pb-1">提示词模板</a>
        <a href="#" onclick="switchCategory('collection')" data-cate="collection" class="hover:text-stone-900 transition pb-1">收藏画师</a>
        <a href="#" onclick="switchCategory('document')" data-cate="document" class="hover:text-stone-900 transition pb-1">📌 记事文档</a>
      </nav>

      <div class="flex items-center space-x-2 md:space-x-4">
        <!-- 随机灵感老虎机按钮 -->
        <button onclick="toggleSlotModal(true)" class="px-3 py-1.5 border border-stone-300 rounded-full text-xs hover:bg-stone-100 transition flex items-center gap-1">
          🎰 随机主题
        </button>

        <!-- AI 助手抽屉唤起按钮 -->
        <button onclick="toggleAIDrawer(true)" class="px-3 py-1.5 border border-stone-900 bg-stone-950 text-white rounded-full text-xs hover:bg-stone-850 transition flex items-center gap-1">
          ✨ AI 助手
        </button>

        <button id="lockBtn" onclick="promptPassword()" class="px-3 py-1.5 border border-stone-300 rounded-full text-xs tracking-wider hover:bg-stone-100 transition flex items-center gap-1.5">
          <span id="lockIcon">🔒</span>
          <span id="lockText">未解锁</span>
        </button>

        <button id="openDrawerBtn" onclick="openDrawer()" class="w-8 h-8 rounded-full bg-stone-950 text-white flex items-center justify-center hover:bg-stone-850 transition">
          ＋
        </button>
      </div>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-12">
    <div class="mb-16 flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-stone-200 pb-6">
      <div>
        <span class="text-xs uppercase tracking-[0.2em] text-stone-400">ARCHIVE / 归档库</span>
        <h1 id="currentCategoryTitle" class="serif-title text-4xl italic mt-2 font-medium">Artist Strings</h1>
      </div>

      <div class="text-right text-xs text-stone-400 tracking-wider">
        <span id="itemCount">LOADING...</span>
      </div>
    </div>

    <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <!-- AI 助手抽屉面板 -->
  <div id="aiDrawerPanel" class="fixed inset-y-0 right-0 z-50 w-full md:w-[480px] bg-[#F4F3EF] border-l border-stone-300 shadow-2xl flex flex-col transition-transform duration-300 translate-x-full">
    <div class="p-4 border-b border-stone-200 flex items-center justify-between bg-stone-100/50">
      <div class="flex items-center gap-2">
        <span class="serif-title font-semibold text-lg">AI Assistant</span>

        <select id="aiPresetSelect" class="text-xs border border-stone-300 bg-white rounded px-2 py-1 focus:outline-none">
          <option value="novelai">NovelAI 预设</option>
          <option value="midjourney">Midjourney 预设</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleAISettingsModal(true)" class="text-xs text-stone-500 hover:text-stone-900">⚙️ 设置</button>
        <button onclick="clearChat()" class="text-xs text-stone-500 hover:text-stone-900">🧹 清空</button>
        <button onclick="toggleAIDrawer(false)" class="text-stone-500 text-lg hover:text-stone-900 px-2">✕</button>
      </div>
    </div>

    <!-- 对话面板区域 -->
    <div id="chatMessagesBox" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <!-- 底部输入框 -->
    <div class="p-4 border-t border-stone-200 bg-white/40 flex flex-col gap-2">
      <div class="flex items-center justify-between text-[10px] text-stone-400">
        <span>按 Enter 发送 / Shift+Enter 换行</span>
        <button onclick="rerollLastAIResponse()" class="text-stone-700 hover:underline">🎲 重新生成 (Re-roll)</button>
      </div>

      <div class="flex gap-2">
        <textarea id="chatInput" placeholder="描述你想要生成的灵感画面..." rows="2" class="flex-1 p-2 bg-white border border-stone-300 rounded text-xs focus:outline-none focus:border-stone-950"></textarea>
        <button onclick="sendChatMessage()" class="px-4 bg-stone-950 text-white rounded text-xs hover:bg-stone-850">发送</button>
      </div>
    </div>
  </div>

  <!-- 老虎机随机主题 Modal 模态框 -->
  <div id="slotModal" class="fixed inset-0 bg-stone-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#F4F3EF] border border-stone-300 rounded-lg max-w-lg w-full p-6 shadow-2xl space-y-6">
      <div class="flex justify-between items-center border-b border-stone-200 pb-3">
        <h2 class="serif-title text-xl font-semibold">🎰 随机灵感抽卡 (Slot Machine)</h2>
        <button onclick="toggleSlotModal(false)" class="text-stone-400 hover:text-stone-900">✕</button>
      </div>

      <!-- 老虎机展示位 -->
      <div id="slotReelsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-3 min-h-[100px]">
        <div class="bg-white/50 border border-stone-200 rounded p-4 text-center text-xs text-stone-400">
          点击下方抽卡按钮
        </div>
      </div>

      <button onclick="spinSlotMachine()" class="w-full py-3 bg-stone-950 text-white text-xs tracking-widest uppercase font-medium rounded hover:bg-stone-850 transition">
        SPIN / 随机生成组合
      </button>

      <!-- 批量导入主题词库 -->
      <div class="border-t border-stone-200 pt-4 space-y-3">
        <div class="text-xs font-medium text-stone-700">📦 批量导入主题词库</div>

        <div class="text-[10px] text-stone-400 bg-stone-200/40 p-2 rounded">
          格式：<strong>分类名 | 词语1, 词语2, 词语3</strong> (一行一组)
        </div>

        <textarea id="topicBatchInput" placeholder="风格 | 赛博朋克, 水彩, 哥特&#10;光影 | 霓虹光, 漫射光, 轮廓光" rows="3" class="w-full p-2 bg-white border border-stone-300 rounded text-xs"></textarea>

        <button onclick="handleBatchImportTopics()" class="w-full py-2 bg-stone-200 text-stone-800 text-xs rounded hover:bg-stone-300">
          导入到词库
        </button>

        <div id="topicManagerContainer" class="space-y-2 max-h-40 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- AI API 配置 Modal -->
  <div id="aiSettingsModal" class="fixed inset-0 bg-stone-950/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#F4F3EF] border border-stone-300 rounded-lg max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-stone-200 pb-2">
        <h3 class="serif-title font-semibold">⚙️ AI API 配置</h3>
        <button onclick="toggleAISettingsModal(false)" class="text-stone-400">✕</button>
      </div>
      
      <div>
        <label class="block text-[10px] text-stone-400 uppercase mb-1">
          API Key * (只存在本地)
        </label>
        <input
          type="password"
          id="cfgApiKey"
          placeholder="sk-..."
          class="w-full p-2 bg-white border border-stone-300 rounded text-xs"
        >
      </div>

      <div>
        <label class="block text-[10px] text-stone-400 uppercase mb-1">
          API Endpoint Base URL
        </label>
        <input
          type="text"
          id="cfgApiEndpoint"
          placeholder="https://api.openai.com/v1"
          class="w-full p-2 bg-white border border-stone-300 rounded text-xs"
        >
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-[10px] text-stone-400 uppercase">
            Select Model / 选择模型
          </label>

          <button
            type="button"
            onclick="fetchAvailableModels()"
            class="text-[10px] text-stone-900 underline hover:opacity-80"
          >
            🔄 获取模型列表
          </button>
        </div>

        <!-- 下拉选择框取代手动输入 -->
        <select
          id="cfgApiModelSelect"
          class="w-full p-2 bg-white border border-stone-300 rounded text-xs focus:outline-none"
        >
          <option value="">-- 请先填 Key 并点击获取模型列表 --</option>
        </select>
      </div>

      <button onclick="saveAISettings()" class="w-full py-2 bg-stone-950 text-white text-xs rounded hover:bg-stone-850 transition">
        保存配置
      </button>
    </div>
  </div>

  <!-- 侧边栏抽屉 -->
  <div id="drawerOverlay" class="fixed inset-0 bg-stone-950/20 backdrop-blur-sm z-50 transition-opacity duration-300 opacity-0 pointer-events-none">
    <div id="drawerPanel" class="fixed right-0 top-0 bottom-0 w-full max-w-lg bg-[#F4F3EF] border-l border-stone-200 shadow-2xl flex flex-col drawer-closed transition-transform duration-300 ease-out">
      <div class="p-6 border-b border-stone-200 flex items-center justify-between">
        <h2 id="drawerTitle" class="serif-title text-2xl italic font-medium">Add to Archive</h2>
        <button onclick="closeDrawer()" class="text-stone-400 hover:text-stone-900 text-xl font-light">✕</button>
      </div>

      <div id="drawerTabs" class="flex border-b border-stone-200 px-6">
        <button id="tabSingleBtn" class="py-3 px-4 text-xs tracking-widest border-b-2 border-stone-950 font-medium text-stone-950">
          SINGLE / 单个添加
        </button>

        <button id="tabBatchBtn" class="py-3 px-4 text-xs tracking-widest border-b-2 border-transparent font-medium text-stone-400 hover:text-stone-950">
          BATCH / 批量导入
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <form id="formSingle" onsubmit="handleSingleSubmit(event)" class="space-y-4">
          <input type="hidden" id="editId" value="">

          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Title / 名称 *</label>
            <input type="text" id="singleTitle" required class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-sm">
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Category / 分类 *</label>
              <select id="singleCategory" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-sm">
                <option value="artist-string">画师串</option>
                <option value="single-artist">单独画师</option>
                <option value="template">提示词模板</option>
                <option value="collection">收藏画师</option>
                <option value="document">📌 记事文档</option>
              </select>
            </div>

            <div>
              <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Tags / 标签</label>
              <input type="text" id="singleTags" placeholder="#古风,#插画" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-sm">
            </div>
          </div>

          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Prompt String / 内容 * (加密存储)</label>
            <textarea id="singleContent" rows="6" required class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-sm"></textarea>
          </div>

          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Remarks / 备注 (明文)</label>
            <textarea id="singleRemarks" rows="2" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-sm"></textarea>
          </div>

          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Image Preview / 预览图</label>

            <div id="existingImageContainer" class="hidden mb-2">
              <img id="existingImagePreview" src="" class="h-20 object-cover rounded border border-stone-300">
            </div>

            <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-stone-500">
            <p id="compressStatus" class="text-[10px] text-stone-400 mt-1"></p>
          </div>

          <button type="submit" id="singleSubmitBtn" class="w-full py-3 bg-stone-950 text-white text-xs tracking-widest uppercase font-medium rounded">
            Save to Archive / 保存
          </button>
        </form>

        <form id="formBatch" onsubmit="handleBatchSubmit(event)" class="space-y-4 hidden">
          <div>
            <label class="block text-[10px] tracking-widest text-stone-400 uppercase mb-1">Batch Category *</label>
            <select id="batchCategory" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-sm">
              <option value="artist-string">画师串</option>
              <option value="single-artist">单独画师</option>
              <option value="template">提示词模板</option>
              <option value="collection">收藏画师</option>
              <option value="document">📌 记事文档</option>
            </select>
          </div>

          <div>
            <textarea id="batchInput" placeholder="名称 1 | 画师串 1 | 备注 1 | #标签1" rows="10" class="w-full px-3 py-2 bg-white/50 border border-stone-300 rounded text-xs font-mono"></textarea>
          </div>

          <button type="submit" class="w-full py-3 bg-stone-950 text-white text-xs tracking-widest uppercase font-medium rounded">
            Import All / 一键导入
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="border-t border-stone-200 py-8 text-center text-[10px] tracking-[0.2em] text-stone-400 uppercase mt-auto">
    © MUSÉE COLLECTION. ALL RIGHTS RESERVED.
  </footer>

  <!-- 引入解耦后的 JS 模块 -->
  <script src="js/config.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/db.js"></script>
  <script src="js/archive-ui.js"></script>
  <script src="js/ai-chat.js"></script>
  <script src="js/slot-machine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
